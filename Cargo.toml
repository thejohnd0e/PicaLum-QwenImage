[workspace]
resolver = "2"
members = ["crates/qil-core", "crates/qil-cli", "app/src-tauri"]

[workspace.package]
version = "0.1.18"
edition = "2021"
license = "MIT"
repository = "https://github.com/thejohnd0e/PicaLum-QwenImage"

[workspace.dependencies]
qil-core = { path = "crates/qil-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
