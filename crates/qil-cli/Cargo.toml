[package]
name = "qil-cli"
description = "qil: command line for Qwen-Image-2.1 on small GPUs"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "qil"
path = "src/main.rs"

[dependencies]
qil-core.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
